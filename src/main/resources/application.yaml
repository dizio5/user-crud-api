spring:
  application:
    name: demo

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:prueba}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

security:
  jwt:
    issuer: localhost
    secret: ${SECRET_JWT}
    expiration-ms: 3600000
